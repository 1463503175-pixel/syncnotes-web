<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title description">
<title id="title">SyncNotes — a calmer place for everything worth keeping</title>
<desc id="description">Original illustrated concept of the SyncNotes local-first note workspace, not an actual app screenshot. It shows a note timeline, gallery and editor in a light green and ivory interface.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A1F1B"/><stop offset=".62" stop-color="#122C25"/><stop offset="1" stop-color="#193B31"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EDE5CA"/><stop offset="1" stop-color="#C9DFCE"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#77B69F" stop-opacity=".30"/><stop offset="1" stop-color="#77B69F" stop-opacity="0"/></radialGradient>
 <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A5C6B5"/><stop offset=".55" stop-color="#E5E8CE"/><stop offset="1" stop-color="#87A8A3"/></linearGradient>
 <filter id="shadow" x="-30%" y="-40%" width="170%" height="190%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#07150F" flood-opacity=".38"/></filter>
